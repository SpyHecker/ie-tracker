<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account | Final Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./register.css" />
  </head>
  <body>
    <div class="register-shell">
      <section class="left-side">
        <a class="home-link" href="./index.html">Final Tracker</a>
        <h1>
          Create Your<br />
          <span>Account</span>
        </h1>
        <p>
          Start tracking your income and expenses in minutes.
        </p>

        <div class="visual-stack">
          <article class="tile chart"></article>
          <article class="tile card"></article>
          <article class="tile coin"></article>
        </div>

        <small class="copyright">&copy; 2026 Final Tracker</small>
      </section>

      <section class="right-side">
        <form id="registerForm" class="register-panel">
          <div class="brand-row">
            <span class="brand-icon">F</span>
            <strong>Final Tracker</strong>
          </div>

          <h2>Create Account</h2>
          <p>Fill the form to get started.</p>

          <label for="fullName">FULL NAME</label>
          <input id="fullName" name="fullName" type="text" placeholder="Your full name" required />

          <label for="email">EMAIL</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" required />

          <div class="key-grid">
            <div>
              <label for="password">PASSWORD</label>
              <input id="password" name="password" type="password" placeholder="........" required />
            </div>
            <div>
              <label for="confirmPassword">CONFIRM PASSWORD</label>
              <input id="confirmPassword" name="confirmPassword" type="password" placeholder="........" required />
            </div>
          </div>

          <button id="registerBtn" class="register-btn" type="submit">Create Account</button>
          <p id="registerMessage" class="form-message" role="status" aria-live="polite"></p>

          <div class="separator">OR CONTINUE WITH</div>

          <div class="socials">
            <button type="button" data-oauth="Google">GOOGLE</button>
            <button type="button" data-oauth="Facebook">FACEBOOK</button>
          </div>

          <p class="switch-auth">
            Already have an account? <a href="./login.html">Login</a>
          </p>
          <p class="back-home">
            <a href="./index.html">Back to Home</a>
          </p>
        </form>

        <div class="meta-strip">
          <span>Simple</span>
          <span>Fast</span>
          <span>Reliable</span>
        </div>
      </section>
    </div>
    <script src="./scripts/auth.js"></script>
    <script src="./scripts/register.js"></script>
  </body>
</html>
